# فحص أسبوعي تلقائي للموقع المنشور: هل كل الصفحات تعمل، وهل السرعة وسهولة الوصول جيدة؟
# عند وجود خلل يُفتح بلاغ (Issue) في المستودع فيصل تنبيه لصاحبه، ويُغلق البلاغ تلقائياً حين يعود الفحص سليماً.
# Weekly health check of the live site (.github/scripts/monitor.mjs). Opens an issue when something needs
# attention and closes it once a later check passes. Free on public repositories.
name: فحص الموقع الأسبوعي

on:
  schedule:
    - cron: '17 5 * * 6' # كل سبت 08:17 بتوقيت الرياض
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: true

env:
  ISSUE_TITLE: 'فحص الموقع الأسبوعي: يحتاج نظرة'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # After the move to Cloudflare the SITE_URL variable takes over automatically.
      SITE: ${{ vars.SITE_URL || 'https://safwanalasmar.github.io' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Check pages and measure
        run: node .github/scripts/monitor.mjs
      - name: Open or update the alert
        if: failure()
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body-file monitor-report.md
          else gh issue create --title "$ISSUE_TITLE" --body-file monitor-report.md; fi
      - name: Close the alert once healthy
        if: success()
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then gh issue close "$number" --comment "عاد الفحص سليماً."; fi
