# نشر خادم الرسائل على Cloudflare، ثم إعادة نشر الموقع على GitHub Pages مربوطاً به.
# Deploys the message API to Cloudflare, then republishes the GitHub Pages site wired to it.
#
# One-time setup (repo owner, GitHub → Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   TURNSTILE_SECRET       (Turnstile widget secret key; copied to the Worker)
#   RESEND_API_KEY         (Resend, sending access; copied to the Worker)
# The account ID and the Turnstile site key are public identifiers and live below / in pages.yml.
# Until CLOUDFLARE_API_TOKEN exists this workflow does nothing. Run it by hand once after adding the secrets.
name: Deploy

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9cc1f581b4d5f3986c417c11831cb55b
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "Cloudflare secrets not added yet — nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci
      - if: steps.setup.outputs.ready == 'true'
        run: npm test
      - name: Make sure the account has a workers.dev subdomain
        if: steps.setup.outputs.ready == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$sub" ]; then
            for name in safwanalasmar safwan-alasmar safwan-site; do
              if curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                   --data "{\"subdomain\":\"$name\"}" "$api" > /dev/null; then sub=$name; break; fi
            done
          fi
          echo "workers.dev subdomain: ${sub:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$sub" ]
      - if: steps.setup.outputs.ready == 'true'
        run: npm run deploy:api
      - name: Sync API secrets
        if: steps.setup.outputs.ready == 'true'
        working-directory: apps/api
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for name in TURNSTILE_SECRET RESEND_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; fi
          done
      - name: Republish the site wired to the API
        if: steps.setup.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
