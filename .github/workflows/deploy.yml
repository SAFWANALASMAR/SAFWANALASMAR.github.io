# النشر التلقائي على Cloudflare عند كل دمج في main، بعد نجاح الفحوص.
# Deploys the API, then the site, to Cloudflare on every push to main — only after checks pass.
#
# One-time setup (by the repo owner, in GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID,
#              TURNSTILE_SECRET, RESEND_API_KEY  (copied to the API Worker as Worker secrets on each deploy)
#   Variables: SITE_URL              (e.g. https://safwan-web.<subdomain>.workers.dev)
# Until SITE_URL is set this workflow skips itself.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy:api
      - name: Sync API secrets
        working-directory: apps/api
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for name in TURNSTILE_SECRET RESEND_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; fi
          done
      - run: npm run deploy:web
