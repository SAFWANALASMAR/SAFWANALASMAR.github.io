# زر «نشر الموقع»: من تبويب Actions ← نشر الموقع ← Run workflow.
# Manual publish to GitHub Pages: builds the site from main and pushes it to the gh-pages branch.
# Runs only when the owner presses the button — never automatically.
# After publishing it also clears old run history, keeping the newest run of each workflow.
# بعد النشر يُنظَّف سجل التشغيل القديم تلقائياً ويبقى الأحدث من كل مسار.
name: نشر الموقع

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Find the message API
        id: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          # Wire the forms to the API only when it is set up and answering; otherwise they keep opening the mail app.
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$SITE_KEY" ] || { echo "Message API not set up — forms use the mail app."; exit 0; }
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
          [ -n "$sub" ] || { echo "No workers.dev subdomain yet."; exit 0; }
          base="https://safwan-api.$sub.workers.dev"
          if curl -fsS "$base/api/health" | grep -q '"ok":true'; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "Forms post to $base" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "API not answering at $base yet — forms use the mail app." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://safwanalasmar.github.io
          PUBLIC_API_BASE: ${{ steps.api.outputs.base }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ steps.api.outputs.base && secrets.TURNSTILE_SITE_KEY || '' }}
      - name: Push to gh-pages
        working-directory: apps/web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config core.autocrlf false
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Clean old run history
        continue-on-error: true # a cleanup hiccup must never fail a publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 20 # let the Pages build started by this push appear, so the previous one counts as old
          bash "$GITHUB_WORKSPACE/.github/scripts/clean-runs.sh"
