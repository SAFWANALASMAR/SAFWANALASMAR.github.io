faq:
  title: أسئلة شائعة
  items:
    - q: كيف أبدأ؟
      a: من صفحة «اطلب مشروعك» في أربع خطوات قصيرة، أو برسالة من صفحة التواصل. بعدها نبدأ بجلسة لفهم الإجراء الحالي والمشكلة الحقيقية.
    - q: عندي فكرة غير مكتملة، هل تكفي؟
      a: نعم. الطلب يقبل الفكرة كاملة أو جزئية، ويمكنك إرفاق رابط ملف أو مسودة، ونكمل التفاصيل معاً في جلسة الفهم.
    - q: كم التكلفة؟
      a: التسعير حسب نطاق العمل. في نموذج الطلب تختار نطاق ميزانية تقريبياً أو «لست متأكداً»، ثم يصلك عرض مخصص.
    - q: ما الخطوات بعد إرسال الطلب؟
      a: أفهم الإجراء، ثم أوثّق المتطلبات في وثيقة مختصرة تُعتمد قبل أي كود، ثم أبني على مراحل بمعاينة في كل مرحلة، ثم أسلّم مع دليل استخدام ودعم بعد الإطلاق.
    - q: هل أستطيع طلب أكثر من خدمة؟
      a: نعم. تختار في الطلب الواحد البرمجة والتسويق والإعلام معاً، ولكل خدمة خياراتها.
    - q: هل تدعم الأنظمة العربية بالكامل؟
      a: نعم. أبني الحلول العربية من اليمين إلى اليسار كما ينبغي، في الواجهات والتقارير والمستندات، مع نسخة إنجليزية عند الحاجة.
