about:
  title: من أنا
  photoAlt: صورة صفوان الأسمر
  initials: ص أ
  bio: "أنا صفوان، خريج علوم الحاسب من كلية ينبع الصناعية التابعة للهيئة الملكية للجبيل وينبع. بدأت بتحليل الأعمال وتطوير التطبيقات في التدريب التعاوني، وحوّلت نموذجاً ورقياً إلى نظام ويب بمسار اعتماد متدرج وقاعدة بيانات صممتها من الصفر. أعمل اليوم مديراً للعلاقات العامة والتسويق ورئيساً لقسم الإعلام في جمعية المقارئ القرآنية بالمدينة المنورة، وأتولى فيها التحول الرقمي وأتمتة التقارير والمستندات وإعادة بناء الأرشيف. وأقود تطوعاً مشروع بوابة جمعية إعجاز الإلكترونية التي أُطلقت رسمياً في نوفمبر 2026، وأدرّس العربية لغير الناطقين بها على بريبلي. أجمع بين كتابة الكود وفهم ما تحتاجه الإدارة فعلاً، وأبني الحلول العربية من اليمين إلى اليسار كما ينبغي."
  timelineTitle: الخبرات
  timeline:
    - icon: web
      period: أكتوبر 2026 – الآن
      org: جمعية إعجاز للدراسات والبحوث العلمية
      role: مسؤول الاتصال المؤسسي والتحول الرقمي وتنمية الموارد (تطوعي)
      volunteer: true
      points:
        - قيادة مشروع البوابة الإلكترونية للجمعية ejaz.sa من جمع المتطلبات إلى الإطلاق الرسمي في خمسة أسابيع، بلوحة إدارة فيها أكثر من أربعين قسماً وبنية مصممة لتحمّل 30,000 متقدم
        - "الإشراف الهندسي على نظام مسابقات متكامل (مراحل، وبنك أسئلة، ونتائج، وترتيب تراكمي، وسحب إلكتروني) مع حوكمة بيانات المتسابقين: تشفير أرقام الهوية وصلاحيات اطلاع محددة"
        - تأسيس الحضور الرقمي للجمعية من حسابين قائمين إلى ثماني منصات بمعرّف وهوية موحدين، وإدارة المحتوى وصياغة الأخبار الرسمية
        - التعاون والتواصل مع الجهات المانحة، وبناء الأرشيف المؤسسي والتقارير الدورية
      link: https://ejaz.sa/
      linkLabel: زيارة البوابة
    - icon: book
      period: مايو 2026 – الآن
      org: جمعية المقارئ القرآنية بالمدينة المنورة
      role: مدير العلاقات العامة والتسويق ورئيس قسم الإعلام (منذ سبتمبر 2026)، وقبلها مسؤول العلاقات العامة والتسويق
      points:
        - رئاسة قسم الإعلام بعد إعداد وثيقة تأسيسه، وإعادة تشغيل منصات التواصل المتوقفة بخطة نشر يومية على سبع منصات
        - إعداد ورفع خمسة تقارير ختامية لجهات مانحة، منها مؤسسات أبانمي والجميح والموسى والعيسى، كلٌّ بمتطلبات جهته
        - إعداد ملف طلب دعم مشروع التمكين المؤسسي كاملاً، ثم إدارة المشروع الممول من مؤسسة سليمان أبانمي الأهلية بخطة تشغيلية معتمدة وتقارير شهرية ودورية
        - حصر 23 جهة مانحة و17 منصة منح، وحصر الشراكات القائمة وصياغة مسودة قواعد الشراكة
        - تفعيل نظام جسر وإعداد ستة مسيرات شهرية متتالية حتى الاعتماد والدفع، ومعالجة نحو 300 فاتورة عهدة في ملف موحّد
        - إعادة هيكلة الأرشيف الرقمي ومطابقة 901 ملف، وبناء 39 مهارة مؤتمتة بالذكاء الاصطناعي للأعمال المتكررة
        - قيادة التحول الرقمي، ومنه الإشراف على نقل موقع الجمعية إلى بناء مخصص، وتشغيل المتجر الإلكتروني، وحصر الأصول الرقمية وتأمينها
    - icon: teach
      period: أكتوبر 2025 – الآن
      org: Preply
      role: معلّم العربية والقرآن والتجويد لغير الناطقين بها (عن بُعد، دوام جزئي)
      points:
        - 196 درساً مكتملاً بتقييم 5.0 من 21 مراجعة طلابية
        - أكثر من 167 ساعة تدريس لـ36 طالباً (حتى أغسطس 2026)
        - دروس مخصصة لكل مستوى بمناهج «العربية بين يديك» و«نور البيان» و«القاعدة النورانية»
      link: https://preply.com/ar/tutor/7053708
      linkLabel: صفحتي على بريبلي
    - icon: briefcase
      period: مارس – مايو 2026
      org: شركة التوكيلات العربية للمشاريع الميكانيكية والكهربائية والإلكترونية
      role: مندوب مبيعات وتسويق
    - icon: utensils
      period: فبراير – مارس 2026
      org: شركة عصر النجاح (مطعم)
      role: كاشير ومساعد مشرف
    - icon: code
      period: يناير – يوليو 2025
      org: الهيئة الملكية للجبيل وينبع — الإدارة العامة لتقنية المعلومات
      role: "متدرب تعاوني: تحليل أعمال وتطوير تطبيقات، ودعم فني وبنية تحتية"
    - icon: cake
      period: أبريل – يونيو 2024
      org: محل روش سويت للتجارة (حلويات)
      role: كاشير ومساعد مالك المحل
      points:
        - التسويق للمحل، والإدارة والإشراف على العمل اليومي
        - المحل وعهدته تحت مسؤوليتي
    - icon: car
