faq:
  title: Frequently asked questions
  items:
    - q: How do I start?
      a: Use the "Request a project" page in four short steps, or send a message from the contact page. We then start with a session to understand the current process and the real problem.
    - q: I only have a rough idea. Is that enough?
      a: Yes. The request accepts a complete or partial idea, you can attach a link to a file or draft, and we fill in the details together.
    - q: How much does it cost?
      a: Pricing depends on the scope of work. In the request form you pick an approximate budget range or "not sure", and you receive a tailored quote.
    - q: What happens after I send a request?
      a: I understand the process, document the requirements in a short brief approved before any code, build in stages with a preview at each one, then deliver with a user guide and post-launch support.
    - q: Can I request more than one service?
      a: Yes. One request can combine software, marketing and media, each with its own options.
    - q: Do your systems fully support Arabic?
      a: Yes. I build Arabic solutions right-to-left the way they should be, across interfaces, reports and documents, with an English version when needed.
