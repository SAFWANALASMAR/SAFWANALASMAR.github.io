en:
  title: Personal Website and Scientific Books for a Physics Academic
  summary: A four-language CV and portfolio website on GitHub Pages, and five scientific books prepared in Arabic and English.
  challenge: An academic needing a digital presence for his CV and work, and scientific books ready for publication.
  solution:
    - A personal CV and portfolio website in Arabic, English, French and Spanish, on GitHub Pages
    - Five scientific books prepared with content, indexes and design, in Arabic and English, in full and abridged editions
    - Real, verified references in every book
  role:
    - Built the website
    - Edited and designed the books
  tools: [GitHub Pages]
