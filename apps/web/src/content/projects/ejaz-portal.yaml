ar:
  title: بوابة جمعية إعجاز الإلكترونية
  summary: بوابة خدمات جديدة للجمعية بلوحة إدارة فيها أكثر من أربعين قسماً وبنية مصممة لتحمّل 30,000 متقدم، من المتطلبات إلى الإطلاق الرسمي في خمسة أسابيع.
  org: جمعية إعجاز للدراسات والبحوث العلمية
  challenge: موقع سابق لا يخدم احتياج الجمعية، ومسابقة يُتوقع أن يتقدم لها حتى 30,000 متقدم.
  solution:
    - بوابة جديدة بهوية الجمعية، بلوحة إدارة فيها أكثر من أربعين قسماً
    - "نظام مسابقات كامل: مراحل، وبنك أسئلة، ونتائج، وترتيب تراكمي، وسحب إلكتروني"
    - حماية بيانات المتسابقين بتشفير أرقام الهوية وصلاحيات اطلاع محددة
    - مكتبة كتب للقراءة فقط بلا تحميل
    - "ومن أقسامها: الأخبار والإعلانات، ووثائق الحوكمة، والطلبات والنماذج الإلكترونية، والاجتماعات واللجان، والفرص الوظيفية، وقياس الرضا"
  role:
    - قيادة المشروع من جمع المتطلبات إلى الإطلاق الرسمي
    - الإشراف الهندسي والمراجعة والاعتماد
    - "إدارة الاستضافة والتشغيل: مقارنة العروض، وتجهيز متطلبات الرفع، والنسخ الاحتياطي، والتنسيق مع مهندس الاستضافة"
  tools: [Laravel, Filament]
  result: أُطلقت البوابة رسمياً يوم 10 نوفمبر 2026.
en:
  title: Ejaz Association Web Portal
  summary: A new services portal for the association with an admin panel of 40+ modules and an architecture designed to handle 30,000 applicants, taken from requirements to official launch in five weeks.
  org: Ejaz Association for Scientific Studies and Research
  challenge: A previous website that did not serve the association's needs, and a competition expected to draw up to 30,000 applicants.
  solution:
    - A new portal in the association's identity, with an admin panel of 40+ modules
    - "A full competitions system: stages, question bank, results, cumulative ranking and an electronic draw"
    - Participant data protected with encrypted national ID numbers and restricted access permissions
    - A read-only library of books, with no downloads
    - "Other modules include news and announcements, governance documents, electronic requests and forms, meetings and committees, job opportunities and satisfaction measurement"
  role:
    - Led the project from requirements gathering to official launch
    - Engineering oversight, review and sign-off
    - "Hosting and operations: compared offers, prepared deployment requirements and backups, and coordinated with the hosting engineer"
  tools: [Laravel, Filament]
  result: The portal was officially launched on 10 November 2026.
