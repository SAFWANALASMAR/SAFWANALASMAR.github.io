  summary: تحليل منظم يحوّل الفكرة أو المشكلة إلى خطة واضحة قابلة للتنفيذ.
  includes:
    - وثائق المتطلبات للمشاريع التقنية
    - خطط تسويقية وتشغيلية للمحلات
