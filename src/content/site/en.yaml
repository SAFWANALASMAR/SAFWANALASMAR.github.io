about:
  title: About
  photoAlt: Photo of Safwan Alasmar
  initials: SA
  bio: "I'm Safwan, a Computer Science graduate from Yanbu Industrial College (Royal Commission for Jubail and Yanbu). I started in business analysis and application development during my co-op, turning a paper form into a web system with a tiered approval workflow and a database I designed from scratch. Today I am Public Relations & Marketing Manager and Head of Media at Al-Maqari Quranic Association in Madinah, where I also lead digital transformation, report and document automation, and archive rebuilding. As a volunteer I am developing the Ejaz Association's web portal, and I teach Arabic to non-native speakers on Preply. I combine writing code with a real understanding of what management needs, and I build Arabic, right-to-left solutions the way they should be built."
  timelineTitle: Experience
  timeline:
    - period: Oct 2026 – Present
      org: Ejaz Association for Studies and Scientific Research
      role: Executive Advisor, Corporate Communications & Digital Transformation (volunteer)
      points:
        - Designing and developing the association's web portal, ejaz.sa, to replace a WordPress site and serve around 30,000 users
        - Admin panel with tiered permissions, encryption of sensitive data, an internal security review, and code managed on a protected main branch
        - Set up the association's digital presence with one identity across seven platforms, and run its office
    - period: May 2026 – Present
      org: Al-Maqari Quranic Association, Madinah
      role: Public Relations & Marketing Manager and Head of Media (since Sep 2026); previously Public Relations & Marketing Officer
      points:
        - Oversee the media department, the association's accounts, content plans and daily publishing
        - Prepare final and periodic reports for donors, and contribute to and follow up on funding applications
        - Lead digital transformation, including supervising the website's move to a custom build, running the online store, and auditing and securing digital assets
        - Automated the archive and institutional reporting, and built official document templates
        - Build partnerships and institutional communication, and draft official letters
        - Keep the association's data current on regulatory and donor platforms
    - period: Oct 2025 – Present
      org: Preply
      role: Arabic, Quran and Tajweed teacher for non-native speakers (remote, part-time)
      points:
        - 196 completed lessons with a 5.0 rating from 21 student reviews
        - Over 167 teaching hours with 36 students (as of Aug 2026)
        - Lessons tailored to each level using Al-Arabiyyah Bayna Yadayk, Noor Al-Bayan and Al-Qaidah An-Noraniah
      link: https://preply.com/en/tutor/7053708
      linkLabel: My Preply profile
    - period: Mar – May 2026
      org: Ghassan Trading Company
      role: Sales & Marketing Representative
    - period: Jan – Jul 2025
      org: Royal Commission for Jubail and Yanbu — General Administration of IT
      role: "Co-op trainee: business analysis and application development, technical support and infrastructure"
