about:
  title: About
  photoAlt: Photo of Safwan Alasmar
  initials: SA
  bio: Computer Science graduate from Yanbu Industrial College (Royal Commission for Jubail and Yanbu). I started in business analysis and application development, turning a paper form into a full web system with a tiered approval workflow and a database I designed from scratch. Today I digitize institutional work in the non-profit sector — automating reports and documents, rebuilding archives, leading digital transformation, and building publishing-automation tools. My edge is combining code with a real understanding of what management needs — and building Arabic-first, right-to-left solutions without compromise.
  timelineTitle: Experience
  timeline:
    - period: May 2026 – Present
      org: Al-Maqari Quranic Association, Madinah
      role: Head of Media, leading digital transformation, automation and institutional reporting
    - period: Mar – May 2026
