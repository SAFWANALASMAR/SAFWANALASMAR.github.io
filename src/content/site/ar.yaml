about:
  title: من أنا
  photoAlt: صورة صفوان الأسمر
  initials: ص أ
  bio: "خريج علوم الحاسب من كلية ينبع الصناعية التابعة للهيئة الملكية للجبيل وينبع. بدأت في تحليل الأعمال وتطوير التطبيقات، فحوّلت نموذجاً ورقياً إلى نظام ويب متكامل بمسار اعتماد متدرج وقاعدة بيانات صممتها من الصفر. أعمل اليوم في القطاع غير الربحي على رقمنة العمل المؤسسي: أتمتة التقارير والمستندات، وإعادة بناء الأرشيف، وإدارة التحول الرقمي، وبناء أدوات النشر الآلي. ميزتي أني أجمع بين كتابة الكود وفهم ما تحتاجه الإدارة فعلاً، وأتقن بناء الحلول العربية من اليمين إلى اليسار بلا تنازلات."
  timelineTitle: الخبرات
  timeline:
    - period: مايو 2026 – الآن
      org: جمعية المقارئ القرآنية بالمدينة المنورة
      role: رئيس قسم الإعلام، ويتولى التحول الرقمي والأتمتة والتقارير المؤسسية
    - period: مارس – مايو 2026
      org: شركة غسان التجارية
      role: مندوب مبيعات وتسويق
    - period: أكتوبر 2025 – الآن
      org: Preply
      role: معلّم لغة عربية لغير الناطقين بها (دوام جزئي عن بُعد)
    - period: يناير – يوليو 2025
      org: الهيئة الملكية للجبيل وينبع — الإدارة العامة لتقنية المعلومات
      role: "متدرب تعاوني: تحليل أعمال وتطوير تطبيقات، ودعم فني وبنية تحتية"
    - period: 2018 – 2024
      org: عمل حر
      role: في منصات التوصيل وخدمة العملاء، موّلت به دراستي الجامعية كاملة
  educationTitle: التعليم والشهادات
  education:
    - title: بكالوريوس علوم الحاسب الآلي
      org: كلية ينبع الصناعية، الهيئة الملكية للجبيل وينبع
      date: أكتوبر 2025
    - title: دبلوم مهني في التجارة الإلكترونية والتسويق الرقمي
      date: "2021"
    - title: برنامج ريادة الأعمال والابتكار
      org: منشآت
      date: "2024"
    - title: برنامج إثراء الطلاب الصيفي
      org: أرامكو السعودية
      date: "2017"
  skillsTitle: المهارات
  skills:
    - category: تطوير الخلفية والبيانات
      items: [C#, .NET, ASP.NET Core MVC, Entity Framework Core, ASP.NET Identity, SQL Server]
    - category: الواجهات
      items: [HTML, CSS, JavaScript, TypeScript, React, Bootstrap]
    - category: الأتمتة والسكربتات
      items: [Python, PowerShell, توليد المستندات (OOXML), أدوات الذكاء الاصطناعي]
    - category: السحابة والأدوات
      items: [Git / GitHub, Azure DevOps, Microsoft Azure, Supabase, Google Workspace]
    - category: التحليل
      items: [تحليل الأعمال, وثائق المتطلبات, تصميم مسارات الاعتماد والصلاحيات, إعادة تصميم الإجراءات]
    - category: المنصات
      items: [سلة, جسر, منصات الجهات المانحة]
    - category: اللغات
      items: [العربية (الأم), الإنجليزية (مستوى مهني)]
  volunteerTitle: العمل التطوعي
  volunteer: إمام مسجد بتكليف رسمي من وزارة الشؤون الإسلامية (2025 – الآن) · متبرع منتظم بالدم (2020 – الآن).

