about:
  title: من أنا
  photoAlt: صورة صفوان الأسمر
  initials: ص أ
  bio: "أنا صفوان، خريج علوم الحاسب من كلية ينبع الصناعية التابعة للهيئة الملكية للجبيل وينبع. بدأت بتحليل الأعمال وتطوير التطبيقات في التدريب التعاوني، وحوّلت نموذجاً ورقياً إلى نظام ويب بمسار اعتماد متدرج وقاعدة بيانات صممتها من الصفر. أعمل اليوم مديراً للعلاقات العامة والتسويق ورئيساً لقسم الإعلام في جمعية المقارئ القرآنية بالمدينة المنورة، وأتولى فيها التحول الرقمي وأتمتة التقارير والمستندات وإعادة بناء الأرشيف. وأطوّر تطوعاً بوابة جمعية إعجاز الإلكترونية، وأدرّس العربية لغير الناطقين بها على بريبلي. أجمع بين كتابة الكود وفهم ما تحتاجه الإدارة فعلاً، وأبني الحلول العربية من اليمين إلى اليسار كما ينبغي."
  timelineTitle: الخبرات
  timeline:
    - icon: web
      period: أكتوبر 2026 – الآن
      org: جمعية إعجاز للدراسات والبحوث العلمية
      role: مستشار تنفيذي للاتصال المؤسسي والتحول الرقمي (تطوعي)
      points:
        - تصميم وتطوير بوابة الجمعية الإلكترونية ejaz.sa بدل موقع ووردبريس، مهيأة لنحو 30 ألف مستفيد
        - لوحة إدارة بصلاحيات متدرجة، وتشفير للبيانات الحساسة، ومراجعة أمنية داخلية، وإدارة الشيفرة على فرع رئيسي محمي
        - تأسيس الحضور الرقمي للجمعية بهوية موحدة على سبع منصات، وإدارة مكتبها
    - icon: nonprofit
      period: مايو 2026 – الآن
      org: جمعية المقارئ القرآنية بالمدينة المنورة
      role: مدير العلاقات العامة والتسويق ورئيس قسم الإعلام (منذ سبتمبر 2026)، وقبلها مسؤول العلاقات العامة والتسويق
      points:
        - الإشراف على قسم الإعلام وحسابات الجمعية وخطط المحتوى والنشر اليومي
        - إعداد التقارير الختامية والدورية للجهات المانحة، والمشاركة في طلبات الدعم ومتابعتها
        - قيادة التحول الرقمي، ومنه الإشراف على نقل موقع الجمعية إلى بناء مخصص، وتشغيل المتجر الإلكتروني، وحصر الأصول الرقمية وتأمينها
        - أتمتة الأرشيف والتقارير المؤسسية، وبناء قوالب المستندات الرسمية
        - بناء الشراكات والتواصل المؤسسي، وصياغة الخطابات الرسمية
        - تحديث بيانات الجمعية في المنصات النظامية ومنصات المانحين
    - icon: teach
      period: أكتوبر 2025 – الآن
      org: Preply
      role: معلّم العربية والقرآن والتجويد لغير الناطقين بها (عن بُعد، دوام جزئي)
      points:
        - 196 درساً مكتملاً بتقييم 5.0 من 21 مراجعة طلابية
        - أكثر من 167 ساعة تدريس لـ36 طالباً (حتى أغسطس 2026)
        - دروس مخصصة لكل مستوى بمناهج «العربية بين يديك» و«نور البيان» و«القاعدة النورانية»
      link: https://preply.com/ar/tutor/7053708
      linkLabel: صفحتي على بريبلي
    - icon: briefcase
      period: مارس – مايو 2026
      org: شركة غسان التجارية
      role: مندوب مبيعات وتسويق
    - icon: analysis
